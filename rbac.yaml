apiVersion: v1
kind: ServiceAccount
metadata:
  name: task6-app-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task6-app-role
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task6-app-rolebinding
subjects:
  - kind: ServiceAccount
    name: task6-app-sa
    namespace: default
roleRef:
  kind: Role
  name: task6-app-role
  apiGroup: rbac.authorization.k8s.io